[project]
name = "mxcubeweb"
version = "4.238.0.56"
description = "MXCuBE Web user interface"
authors = [{ name = "The MXCuBE collaboration", email = "mxcube@esrf.fr" }]
requires-python = ">=3.11,<3.12"
readme = "README.md"
license = "LGPL-3.0-or-later"
maintainers = [{ name = "MXCuBE collaboration", email = "mxcube@esrf.fr" }]
keywords = [
    "mxcube",
    "mxcube3",
    "mxcubeweb",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "Flask>=3.1.2,<4",
    "werkzeug>=3.1.3,<4",
    "Flask-SocketIO>=5.5.1,<6",
    "flask-sqlalchemy>=3.1.1,<4",
    "Flask-Security-Too>=5.6.2,<6",
    "argon2_cffi>=23.1.0,<24",
    "flask-login>=0.6.3,<0.7",
    "gevent-websocket==0.10.1",
    "spectree==1.2.1",
    "mock>=4.0.3,<5",
    "ruamel.yaml>=0.17.21,<0.18",
    "scandir>=1.10.0,<2",
    "redis>=5.0.1,<6",
    "jsonschema>=4.17.1,<5",
    "pydantic>=2.8.2,<2.11.0",
    "PyDispatcher>=2.0.6,<3",
    "pytz>=2022.6,<2023",
    "tzlocal>=4.2,<5",
    "mxcubecore[prefect]",
    "bcrypt>=4.0.1,<5",
    "authlib>=1.3.0,<2",
    "python-ldap ==3.4.3"
]

[project.urls]
Homepage = "https://github.com/mxcube/mxcubeweb"
Repository = "https://github.com/mxcube/mxcubeweb"
Documentation = "https://mxcubeweb.readthedocs.io/"

[project.scripts]
mxcubeweb-server = "mxcubeweb:main"

[dependency-groups]
dev = [
    "pre-commit==2.20.0",
    "pytest==7.1.3",
    "pytest-cov==4.0.0",
]
docs = [
    "furo>=2023.9.10,<2024",
    "myst-parser>=2.0.0,<3",
    "sphinx<7.2",
    "sphinx-last-updated-by-git>=0.3.7,<0.4",
    "sphinxcontrib-httpdomain>=1.8.1,<2",
]

[tool.uv]
default-groups = "all"

[tool.uv.sources]
mxcubecore = { git = "https://github.com/AustralianSynchrotron/mxcubecore.git", rev = "uv" }

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"

[tool.black]
line-length = 88
preview = true
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | test
  | ui
  | docs
)/
'''
